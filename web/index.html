<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>冲撞迷阵 Maze Dash — 网页版</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#12131a">
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #12131a;
            background-image: radial-gradient(circle at 50% 0%, #232739 0%, #12131a 60%);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* The stage fills the whole browser window. Each scene's own resolution
           policy then decides the layout, and web-port.js picks an adaptive
           policy for windows whose aspect differs a lot from the 720x1280
           design. Dragging/resizing the window simply re-fits. */
        #GameDiv {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #12131a;   /* replaced at runtime with the scene's own background */
        }
        #GameCanvas {
            display: block;
            width: 100%; height: 100%;
            outline: none; border: none;
            touch-action: none;
        }

        /* --- GitHub badge: lives in the letterbox gutter when there is one --- */
        #repobadge {
            position: fixed;
            z-index: 18;
            display: none;
            align-items: center;
            gap: 7px;
            padding: 7px 12px 7px 10px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: .02em;
            color: #e8ecf5;
            background: rgba(18, 20, 30, .72);
            border: 1px solid rgba(255, 255, 255, .14);
            backdrop-filter: blur(8px);
            text-decoration: none;
            white-space: nowrap;
            opacity: .42;
            transition: opacity .25s ease, transform .18s ease, background .25s ease;
        }
        #repobadge:hover, #repobadge:focus-visible {
            opacity: 1;
            background: rgba(18, 20, 30, .95);
            transform: translateY(-1px);
        }
        #repobadge svg { width: 16px; height: 16px; flex: 0 0 auto; fill: currentColor; }
        @media (max-width: 560px) {
            #repobadge span { display: none; }   /* icon only on narrow screens */
            #repobadge { padding: 7px; }
        }

        /* --- repo link on the loading screen --- */
        #splash .repo-link {
            font-size: 12px;
            letter-spacing: .04em;
            color: #9fb2d0;
            text-decoration: none;
            border-bottom: 1px dashed rgba(159, 178, 208, .45);
            padding-bottom: 2px;
            opacity: .9;
        }
        #splash .repo-link:hover { color: #d6e2f5; }

        /* Loading splash (main.js drives .progress-bar span) */
        #splash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            background: #12131a;
            color: #eef0f6;
            text-align: center;
        }
        #splash .title { font-size: 22px; letter-spacing: .18em; font-weight: 600; opacity: .95; }
        #splash .subtitle { font-size: 12px; letter-spacing: .3em; opacity: .45; text-transform: uppercase; }
        #splash .progress-bar {
            width: 208px; height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .14);
            overflow: hidden;
        }
        #splash .progress-bar span {
            display: block;
            width: 0%; height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #7ee0c0, #69a7ff);
            transition: width .18s ease-out;
        }

        /* Optional hint strip for desktop users (placed by web-port.js so it
           does not sit on top of the in-game tab bar) */
        #keyhint {
            position: fixed;
            left: 50%; top: 12px;
            transform: translateX(-50%);
            z-index: 15;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            letter-spacing: .06em;
            color: #cfd6e6;
            background: rgba(20, 22, 32, .62);
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(6px);
            pointer-events: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        #keyhint.show { opacity: 1; }

        #fatal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 32px;
            background: #1b1116;
            color: #ffd9d9;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            white-space: pre-wrap;
            overflow: auto;
        }
        #fatal b { color: #ff8f8f; font-size: 15px; }

        /* when startup failed, the loading splash must never cover the message,
           even though the boot sequence re-shows it inline */
        body.boot-failed #splash { display: none !important; }
    </style>
</head>
<body>
    <div id="GameDiv">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>

    <div id="fatal"></div>

    <div id="keyhint">方向键 / WASD 或直接拖动鼠标滑动</div>

    <!-- GitHub 角标：内容与位置由 web-port.js 按配置填充 -->
    <a id="repobadge" href="#" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <span id="repobadgeLabel">GitHub</span>
    </a>

    <div id="splash">
        <div class="title">冲撞迷阵</div>
        <div class="subtitle">Maze Dash</div>
        <div class="progress-bar"><span></span></div>
        <a id="splashRepo" class="repo-link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>

    <!-- 0) record asset-request failures as early as possible, so that a boot
            failure can tell the user what actually went wrong (most commonly:
            the page was opened from disk via file://, where the browser blocks
            every XHR the game needs to read res/) -->
    <script charset="utf-8">
        (function () {
            var net = window.__mazeDashNet = { failed: [], ok: 0, started: 0 };
            try {
                var proto = XMLHttpRequest.prototype;
                var rawOpen = proto.open, rawSend = proto.send;
                proto.open = function (method, url) { this.__mazeUrl = url; return rawOpen.apply(this, arguments); };
                proto.send = function () {
                    var self = this;
                    net.started++;
                    this.addEventListener('loadend', function () {
                        var s = self.status;
                        if (s === 0 || s >= 400) {
                            if (net.failed.length < 40) {
                                net.failed.push((s || 'blocked') + ' ' + self.__mazeUrl);
                            }
                        } else { net.ok++; }
                    });
                    return rawSend.apply(this, arguments);
                };
            } catch (e) { /* non-fatal */ }
            window.addEventListener('error', function (ev) {
                var t = ev && ev.target;
                if (t && t.tagName && /^(IMG|AUDIO|SCRIPT|LINK)$/.test(t.tagName)) {
                    if (net.failed.length < 40) { net.failed.push('resource ' + (t.src || t.href || t.tagName)); }
                }
            }, true);
        })();
    </script>

    <!-- 1) build settings (defines window._CCSettings) -->
    <script src="src/settings.js" charset="utf-8"></script>
    <!-- 2) Cocos Creator 2.0.2 browser engine -->
    <script src="cocos2d-js.js" charset="utf-8"></script>
    <!-- 3) port-specific shims / adaptations (must be before boot) -->
    <script src="web-port.js" charset="utf-8"></script>
    <!-- 3b) "custom levels" tab: adds a 6th tab (wrench) to the game's tab bar
            and a placeholder page for the level editor -->
    <script src="custom-tab.js" charset="utf-8"></script>
    <!-- 3c) quiet mode: unlock every skin, silence ads / gift / rate-us / quest
            and world-unlock popups -->
    <script src="clean-mode.js" charset="utf-8"></script>
    <!-- 3d) wide screen: widen the game's own layout (level select grid, in-level HUD) -->
    <script src="wide-ui.js" charset="utf-8"></script>
    <!-- 3e) preload: warm the level-asset descriptors while the player is on the hall -->
    <script src="preload.js" charset="utf-8"></script>
    <!-- 4) boot -->
    <script src="main.js" charset="utf-8"></script>
</body>
</html>
