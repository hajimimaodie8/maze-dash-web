name: Deploy web port to GitHub Pages

# Publishes web/ as a static site, so the game can be played straight from a URL
# with no download:  https://hajimimaodie8.github.io/maze-dash-web/
#
# Only web/ is deployed. The single-file standalone build (dist/) is not built
# here — it is attached to Releases instead.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
